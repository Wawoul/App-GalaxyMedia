# Galaxy Media - nginx site config for LAN-only installs (plain HTTP).
# Installed to /etc/nginx/sites-available/galaxy-media by install.sh (mode: lan).
# For anything reachable from the internet use nginx-galaxy.conf (TLS) instead.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    server_tokens off;

    # Behind a Cloudflare Tunnel (or any proxy in front of this nginx)? Without
    # this the app sees every visitor as the tunnel host's address: the login and
    # pairing rate limits become GLOBAL (one bot can lock everyone out of
    # signing in), and the audit log records the wrong IP. Uncomment both lines
    # and set the first to the address of the machine running cloudflared:
    #
    #   set_real_ip_from 192.168.1.50;
    #   real_ip_header   CF-Connecting-IP;
    #
    # Only requests that really come from that address may set the header, so
    # a LAN client cannot forge it. Leave this off for a LAN-only install.

    client_max_body_size 512m;   # keep in sync with MAX_UPLOAD_MB

    # Admin UI (static build)
    root /opt/galaxy-media/admin/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # API + WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # long-lived device websockets
    }
}
